<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다면평가</title>
<style>
  :root {
    --navy: #1F3864; --blue: #2F5FA8; --panel: #EEF1F6; --gray: #6B7280;
    --border: #E2E6ED; --green: #1F8A57; --greenbg: #EAF5EF; --red: #B23B3B;
    --purple: #6D28D9; --purplebg: #F3EEFC;
    --amber: #B7791F; --amberbg: #FFF8EC; --amberborder: #D9A441;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    background: #F7F8FA; margin: 0; color: #222;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
  header.top { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .logo {
    width: 32px; height: 32px; border-radius: 6px; background: #fff; color: var(--navy);
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-weight: 700; flex-shrink: 0;
    overflow: hidden;
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; padding: 1px; }
  .brand-sub { font-size: 12px; color: var(--gray); }
  .brand-title { font-size: 15px; font-weight: 600; color: var(--navy); }
  footer.credit {
    margin-top: 36px; padding-top: 14px; border-top: 1px solid var(--border);
    font-size: 11.5px; color: #9CA3AF; text-align: center;
  }
  h1 { font-size: 20px; color: var(--navy); margin: 0 0 6px; }
  h2 { font-size: 16px; color: var(--navy); margin: 28px 0 10px; }
  p.desc { color: var(--gray); font-size: 14px; margin: 0 0 20px; }
  .card {
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .card-flex { display: flex; align-items: center; justify-content: space-between; }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600;
  }
  .badge-pending { background: #FBF3E6; color: #C98A1F; }
  .badge-done { background: var(--greenbg); color: var(--green); }
  .btn {
    display: inline-block; background: var(--navy); color: #fff; text-decoration: none;
    padding: 9px 16px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer;
  }
  .btn-secondary { background: var(--panel); color: var(--navy); }
  .btn:hover { opacity: 0.9; }
  a { color: var(--blue); }
  .stat-row { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
  .stat-box { background: var(--panel); border-radius: 8px; padding: 10px 14px; flex: 1; min-width: 110px; }
  .stat-label { font-size: 12px; color: var(--gray); }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--navy); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--gray); font-weight: 600; }
  .scale-row { display: flex; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .scale-opt input { display: none; }
  .scale-opt label {
    display: flex; align-items: center; justify-content: center;
    width: 44px; height: 44px; border-radius: 8px; border: 1.5px solid var(--border);
    cursor: pointer; font-weight: 600; color: #444;
  }
  .scale-opt input:checked + label { background: var(--navy); border-color: var(--navy); color: #fff; }
  .scale-opt.na label { width: auto; padding: 0 14px; }
  textarea, input[type=text] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px;
    font-family: inherit; font-size: 14px;
  }
  footer.note { margin-top: 30px; font-size: 12px; color: var(--gray); }

  /* ---- 관리자 화면 보조 ---- */
  .progress-mini { width: 100%; height: 6px; background: var(--panel); border-radius: 999px; overflow: hidden; margin-top: 4px; }
  .progress-mini > div { height: 100%; background: var(--green); border-radius: 999px; }
  .copy-btn {
    background: var(--panel); color: var(--navy); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .copy-btn:hover { opacity: 0.85; }
  .lock-banner {
    background: #FBEDED; border: 1px solid var(--red); color: #8A2E2E;
    border-radius: 8px; padding: 10px 14px; font-size: 13px; font-weight: 600; margin-bottom: 14px;
  }
  textarea.reminder-box {
    width: 100%; min-height: 90px; font-family: inherit; font-size: 13px; padding: 10px;
    border: 1px solid var(--border); border-radius: 8px; margin-top: 8px;
  }

  /* ---- 평가 화면 전용 레이아웃 ---- */
  body.eval-layout { background: #F7F8FA; }
  .eval-shell { display: flex; min-height: 100vh; }
  .eval-sidebar {
    width: 280px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--border);
    padding: 24px 18px; display: flex; flex-direction: column; overflow-y: auto;
  }
  .eval-sidebar .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
  @media (min-width: 861px) {
    /* 화면을 아래로 내려도 사이드바(진행 현황·사람 목록·제목 줄)가 그대로 보이게 고정. 목록이 길면 사이드바 안에서만 스크롤 */
    .eval-sidebar { position: sticky; top: 0; height: 100vh; align-self: flex-start; padding-top: 0; }
    .eval-sidebar .brand { position: sticky; top: 0; z-index: 3; background: #fff; padding: 24px 0 12px; margin-bottom: 8px; }
  }
  .eval-progress-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; font-size: 13px; }
  .eval-progress-head .label { font-weight: 600; color: var(--navy); }
  .eval-progress-head .count { font-size: 12px; color: var(--gray); }
  .eval-progress-bar { width: 100%; height: 6px; background: var(--panel); border-radius: 999px; margin-bottom: 20px; overflow: hidden; }
  .eval-progress-bar > div { height: 100%; background: var(--green); border-radius: 999px; }

  .eval-cat { margin-bottom: 16px; }
  .eval-cat-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 6px; margin-bottom: 6px; }
  .eval-cat-head .dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; }
  .eval-cat-head .label { font-size: 12.5px; font-weight: 800; }
  .eval-cat-head .count { margin-left: auto; font-size: 11px; font-weight: 600; opacity: 0.75; }

  .eval-item { border-radius: 8px; margin-bottom: 2px; border: 1.5px solid transparent; }
  .eval-item a { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; text-decoration: none; }
  .eval-item.is-current { background: #EFF3FC; border-color: var(--blue); }
  .eval-item .dot-icon {
    width: 18px; height: 18px; border-radius: 999px; flex-shrink: 0; display: flex;
    align-items: center; justify-content: center; font-size: 10px; font-weight: 700;
    background: #F1F2F4; color: #9CA3AF; border: 1.5px solid var(--border);
  }
  .eval-item.is-done .dot-icon { background: var(--greenbg); color: var(--green); border-color: transparent; }
  .eval-item.is-current .dot-icon { background: var(--blue); color: #fff; border-color: transparent; }
  .eval-item .name { font-size: 13px; font-weight: 600; color: #9CA3AF; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eval-item.is-current .name { color: var(--navy); }
  .eval-item.is-done .name { color: #374151; }

  .eval-sidebar-legend { margin-top: auto; padding-top: 14px; border-top: 1px solid var(--border); font-size: 11px; color: #9CA3AF; line-height: 1.6; }

  .eval-main { flex-grow: 1; padding: 32px 40px 60px; max-width: 880px; }
  .eval-banner {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    border-radius: 10px; padding: 14px 20px; border: 1px solid; margin-bottom: 18px;
  }
  .eval-banner .left { display: flex; align-items: center; gap: 10px; }
  .eval-banner .left .dot { width: 10px; height: 10px; border-radius: 999px; display: inline-block; }
  .eval-banner .left .title { font-size: 19px; font-weight: 700; }
  .eval-banner .left .desc { font-size: 13px; color: #5A6B85; }
  .eval-banner .step { font-size: 12px; font-weight: 600; background: #fff; border: 1px solid; padding: 4px 12px; border-radius: 999px; }

  .eval-head { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 16px; align-items: start; margin-bottom: 14px; }
  .eval-head-right { height: 150px; }
  .eval-title { font-size: 22px; color: var(--navy); margin: 0 0 4px; }
  .eval-target-meta { font-size: 13px; color: var(--gray); margin: 0 0 12px; }
  .eval-target-meta .sep { margin: 0 6px; color: var(--border); }

  .eval-na-card {
    display: flex; align-items: center; gap: 10px; background: var(--amberbg); border: 1.5px dashed var(--amberborder);
    border-radius: 10px; padding: 8px 12px;
  }
  .eval-na-card .icon {
    width: 28px; height: 28px; border-radius: 999px; background: #FCEACB; color: #8A5A11;
    display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0;
  }
  .eval-na-card .text { flex-grow: 1; min-width: 0; line-height: 1.35; }
  .eval-na-card .text .t1 { font-size: 13.5px; font-weight: 700; color: #7A5310; display: block; }
  .eval-na-card .text .t2 { font-size: 12px; color: #9C7A3C; display: block; }
  .eval-na-card button {
    background: var(--amber); color: #fff; border: none; border-radius: 8px; padding: 7px 14px;
    font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0;
  }

  .eval-q-card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
  .eval-q-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .eval-q-text { font-size: 14px; font-weight: 600; flex-grow: 1; }
  .eval-q-scale { display: flex; gap: 5px; flex-shrink: 0; }
  .eval-scale-opt input, .eval-na-opt input { display: none; }
  .eval-scale-opt label {
    width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600; cursor: pointer; background: #fff; border: 1.5px solid var(--border); color: #444;
  }
  .eval-scale-opt input:checked + label { background: var(--navy); border-color: var(--navy); color: #fff; }
  .eval-na-opt label {
    padding: 0 10px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; cursor: pointer; background: #fff; border: 1.5px solid var(--border); color: #444;
  }
  .eval-na-opt input:checked + label { background: var(--navy); border-color: var(--navy); color: #fff; }
  .eval-q-toggle { background: none; border: none; color: var(--blue); font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 6px; white-space: nowrap; flex-shrink: 0; }
  .eval-q-comment { display: none; margin-top: 10px; }
  .eval-q-comment.is-open { display: block; }
  .eval-q-comment input { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }

  .eval-overall { background: #fff; border: 2px solid var(--blue); border-radius: 10px; padding: 16px 18px; margin: 14px 0; }
  .eval-overall .head { font-size: 14px; font-weight: 700; color: var(--navy); margin-bottom: 4px; }
  .eval-overall .head .opt { font-weight: 400; color: var(--gray); font-size: 12px; }
  .eval-overall .hint { font-size: 12px; color: var(--gray); margin-bottom: 8px; }
  .eval-overall textarea { width: 100%; height: 70px; padding: 9px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; resize: vertical; }

  .eval-item.is-partial .dot-icon { background: #FBF3E6; color: #C98A1F; border-color: #E8C98A; }
  .eval-item.is-partial .name { color: #374151; }

  /* 하단 고정 저장 바 */
  .eval-savebar {
    position: sticky; bottom: 0; z-index: 20; margin-top: 16px; padding: 12px 14px;
    background: #fff; border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 -4px 14px rgba(31,56,100,0.08); display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .eval-savebar .status { flex: 1 1 200px; font-size: 13px; color: var(--gray); }
  .eval-savebar .status.is-dirty { color: var(--amber); font-weight: 700; }
  .eval-savebar .status.is-saved { color: var(--green); font-weight: 700; }
  .eval-savebar .btn-save { min-width: 140px; font-size: 15px; }
  .eval-savebar .btn[disabled] { background: #C9CED6; cursor: not-allowed; }

  /* 저장 완료 알림(화면 상단, 눈에 띄게) */
  #toast {
    position: fixed; top: 18px; left: 50%; transform: translate(-50%, -140%); z-index: 1000;
    max-width: min(560px, 92vw); padding: 16px 22px; border-radius: 12px; color: #fff;
    font-size: 16px; font-weight: 700; line-height: 1.45; box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    transition: transform .25s ease, opacity .2s ease, visibility 0s linear .25s; cursor: pointer; background: var(--green);
    opacity: 0; visibility: hidden; pointer-events: none;   /* 숨김 상태에서 위쪽 가장자리가 비쳐 보이지 않도록 */
  }
  #toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; pointer-events: auto; transition-delay: 0s; }
  #toast.warn { background: #B7791F; }
  #toast.error { background: var(--red); }
  #toast .sub { display: block; font-size: 13px; font-weight: 500; opacity: .95; margin-top: 3px; }

  /* ---- 대시보드 ---- */
  .badge-wait { background: #EEF0F4; color: #7B8494; }
  .dash-hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  .dash-hero > div:first-child { min-width: 0; }
  .dash-hero h1 { margin-bottom: 4px; }
  .dash-desc { word-break: keep-all; }
  .dash-desc a { white-space: nowrap; }
  .mascot.mascot--dash { width: 112px; margin: 0 6px -6px 0; }
  .dash-bubble { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
                 background: #EEF6E7; border: 1px solid #CFE3BD; border-radius: 14px; padding: 12px 16px; margin: 6px 0 18px; }
  .dash-bubble::before { content: ""; position: absolute; top: -8px; right: 54px; width: 14px; height: 14px; background: #EEF6E7;
                         border-left: 1px solid #CFE3BD; border-top: 1px solid #CFE3BD; transform: rotate(45deg); }
  .dash-bubble .msg { font-size: 15px; font-weight: 700; color: #2F5A12; }
  .dash-bubble .sub { display: block; font-size: 12.5px; font-weight: 600; color: #B7791F; margin-top: 2px; }
  .dash-bubble--locked { background: var(--panel); border-color: var(--border); }
  .dash-bubble--locked::before { background: var(--panel); border-color: var(--border); }
  .dash-bubble--locked .msg { color: var(--navy); }
  .dash-bubble .btn-continue { background: var(--navy); color: #fff; text-decoration: none; font-size: 13.5px; font-weight: 700;
                               padding: 9px 16px; border-radius: 8px; white-space: nowrap; }
  .dash-bubble .btn-continue:hover { background: var(--blue); }
  .dash-progress { margin: -6px 0 20px; }
  .dash-progress .row { display: flex; justify-content: space-between; font-size: 12px; color: var(--gray); }
  .dash-progress .progress-mini { height: 8px; }
  @media (max-width: 520px) {
    .mascot.mascot--dash { width: 80px; }
    .dash-bubble::before { right: 34px; }
    .dash-bubble .btn-continue { width: 100%; text-align: center; }
  }

  /* ---- 캐릭터 옆 말풍선 ON/OFF 스위치 ---- */
  .eval-head-right { height: auto; }
  .mascot-switch-row { display: flex; justify-content: flex-end; margin-top: 2px; }
  .mascot-side-col { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; margin-left: auto; flex-shrink: 0; }
  .eval-sidebar .brand { align-items: flex-start; }
  .bubble-switch { display: none; align-items: center; gap: 6px; border: 1px solid #D5D9E0; background: #EEF0F4; color: #7B8494; border-radius: 999px;
                   padding: 3px 9px 3px 10px; font: inherit; font-size: 11px; font-weight: 700; line-height: 1.2; cursor: pointer; white-space: nowrap;
                   transition: background .15s, color .15s, border-color .15s; -webkit-tap-highlight-color: transparent; }
  .bubble-switch .bs-track { position: relative; width: 24px; height: 14px; border-radius: 999px; background: #C3C9D3; transition: background .15s; flex-shrink: 0; }
  .bubble-switch .bs-knob { position: absolute; top: 2px; left: 2px; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .bubble-switch .bs-state { min-width: 22px; text-align: left; }
  .bubble-switch[aria-checked="true"] { background: #E6F2DA; border-color: #9CC97A; color: #2F5A12; }
  .bubble-switch[aria-checked="true"] .bs-track { background: #6FA83A; }
  .bubble-switch[aria-checked="true"] .bs-knob { transform: translateX(10px); }
  .bubble-switch:hover { filter: brightness(.97); }
  .bubble-switch:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  /* 캐릭터가 있는 자리의 스위치만 보인다 (제목 줄=home, 그 외=사이드바) */
  body[data-mascot-state="home"] .bubble-switch--main { display: inline-flex; }
  body:not([data-mascot-state="home"]) .bubble-switch--side { display: inline-flex; }
  .bubble-switch[hidden] { display: none !important; }
  @media (max-width: 860px) { .bubble-switch--main { display: none !important; } }

  /* ---- 마스코트 말풍선 (평가 화면) ---- */
  .mascot-bubble { position: fixed; z-index: 7; max-width: 300px; box-sizing: border-box; padding: 10px 34px 10px 14px; border-radius: 14px;
                   background: #fff; border: 1.5px solid #9CC97A; color: #2F4A18; font-size: 13.5px; line-height: 1.5; font-weight: 600;
                   box-shadow: 0 6px 20px rgba(31,56,100,.16); pointer-events: none; opacity: 0; transform: translateY(4px) scale(.97);
                   transition: opacity .18s ease, transform .18s ease; visibility: hidden; }
  .mascot-bubble.show { opacity: 1; transform: none; visibility: visible; }
  .mascot-bubble .mb-close { pointer-events: auto; cursor: pointer; font-family: inherit; position: absolute; top: 4px; right: 6px; border: 0; background: transparent; color: #7B8494; font-size: 14px; line-height: 1; padding: 4px; }
  .mascot-bubble .mb-close:hover { color: #1F3864; }
  .mascot-bubble .mb-tail { position: absolute; width: 12px; height: 12px; background: #fff; transform: rotate(45deg); }
  .mascot-bubble.is-left .mb-tail { right: -7px; top: var(--tail, 24px); border-right: 1.5px solid #9CC97A; border-top: 1.5px solid #9CC97A; }
  .mascot-bubble.is-below .mb-tail { top: -7px; left: var(--tail, 24px); border-left: 1.5px solid #9CC97A; border-top: 1.5px solid #9CC97A; }
  @media print { .mascot-bubble, .bubble-switch { display: none; } }

  /* ---- 마스코트 ---- */
  .mascot { display: block; position: relative; padding: 0; border: 0; background: transparent; cursor: pointer;
            width: 140px; aspect-ratio: 1; flex-shrink: 0; mix-blend-mode: multiply; -webkit-tap-highlight-color: transparent; }
  .mascot img, .mascot video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .mascot video { opacity: 0; transition: opacity .15s ease; }
  .mascot.is-playing video { opacity: 1; }
  .mascot:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 12px; }
  .mascot--login { margin: 0 auto 6px; width: 150px; }
  /* 평가 화면: 본체는 문서 맨 아래에 한 개만 있고, JS가 두 '자리'(제목 줄 오른쪽 / 사이드바 제목 옆) 사이로 옮긴다 */
  .mascot--eval { position: absolute; left: 0; top: 0; width: 56px; margin: 0; z-index: 6; visibility: hidden; }
  .mascot--eval.is-placed { visibility: visible; }
  .mascot--eval.is-gliding { transition: left .38s cubic-bezier(.3,.7,.3,1), top .38s cubic-bezier(.3,.7,.3,1), width .38s cubic-bezier(.3,.7,.3,1); }
  .mascot-slot { display: block; width: 100%; aspect-ratio: 1; }
  .mascot-slot--side { width: 56px; flex-shrink: 0; }
  @media (max-width: 860px) {
    .eval-head { grid-template-columns: 1fr; }
    .eval-head-right { display: none; }
  }
  @media (max-width: 420px) { .mascot--login { width: 120px; } }
  @media print { .mascot { display: none; } }

  @media (max-width: 860px) {
    .eval-shell { flex-direction: column; }
    .eval-sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border); }
    .eval-main { padding: 20px 16px 40px; max-width: none; }
  }
</style>
</head>
<body class="{% block body_class %}{% endblock %}">
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* 공용 알림: showToast(메시지, 종류, 보조문구). 페이지 이동 직전에 저장한 경우, 이동한 화면에서 이어서 보여준다. */
var __toastTimer = null;
function showToast(msg, kind, sub, sticky) {
  var el = document.getElementById('toast');
  el.className = (kind || '');
  el.innerHTML = '';
  el.appendChild(document.createTextNode(msg));
  if (sub) { var sp = document.createElement('span'); sp.className = 'sub'; sp.textContent = sub; el.appendChild(sp); }
  void el.offsetWidth;
  el.classList.add('show');
  clearTimeout(__toastTimer);
  if (!sticky) __toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 7000);
}
document.getElementById('toast').addEventListener('click', function(){ this.classList.remove('show'); });
(function(){
  try {
    var raw = sessionStorage.getItem('evalFlash');
    if (raw) { sessionStorage.removeItem('evalFlash'); var f = JSON.parse(raw); showToast(f.msg, f.kind, f.sub); }
  } catch (e) {}
})();
</script>
{% block body %}
<div class="wrap">
  <header class="top">
    <div class="logo">
      <img src="/static/genians_logo.png" alt="Genians"
           onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <span style="display:none;width:100%;height:100%;align-items:center;justify-content:center;">다</span>
    </div>
    <div>
      <div class="brand-title">다면평가</div>
      <div class="brand-sub">{{ brand_subtitle() }}</div>
    </div>
  </header>
  {% block content %}{% endblock %}
  <footer class="credit">{{ credit_line() }}</footer>
</div>
{% endblock %}
</body>
</html>
